# dsh-mobile: standalone mobile surface for the dsh web GUI.
# Inserts one plugin row that mounts the pairing state machine, the /m/ phone
# page, and the /m/api RPC channel.
#
# Two HTTP faces share the same state:
#   - the GUI's webServer (loopback) -> powers the in-app settings panel
#   - a dedicated 0.0.0.0:<mobilePort> listener -> phone / LAN / public proxy
# The dedicated listener is what makes LAN and the existing reverse proxy work
# without touching the GUI's bind address or its dynamic port.
#
# `pairCode` is the fixed pairing code (no expiry, no random). Set it to ''
# to fall back to a random 6-digit code that expires after 5 minutes.
# `publicBaseUrl` is informational: the settings panel displays it so the phone
# knows the public address. Leave it empty if you only use LAN.
- insert:
    - id: dsh-mobile
      name: 'dsh-mobile'
      config:
        enabled: true
        mobilePort: 19387
        pairCode: '123456'
        publicBaseUrl: 'https://dshm.elysia.xin:45632'
