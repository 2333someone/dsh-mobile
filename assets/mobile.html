<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4D6BFE">
<title>dsh</title>
<link rel="icon" href="/m/icon.svg">
<style>
:root{
  --brand:#4D6BFE;
  --brand-soft:rgba(77,107,254,.12);
  --bg:#ffffff;
  --bg-1:#f5f6f8;
  --bg-2:#eceef2;
  --fg:#1b1c20;
  --fg-2:#6b6e78;
  --border:#e6e7ec;
  --bubble-user:#4D6BFE;
  --bubble-user-fg:#ffffff;
  --err:#e5484d;
  --ok:#18a058;
  --radius:16px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#151517;
    --bg-1:#1e1f24;
    --bg-2:#26282f;
    --fg:#f2f3f5;
    --fg-2:#9a9ea8;
    --border:#2b2d33;
    --brand-soft:rgba(123,155,255,.16);
    --bubble-user:#4D6BFE;
    --bubble-user-fg:#ffffff;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--fg);font-size:15px;line-height:1.5;
}
.view{display:none;flex-direction:column;height:100%;min-height:100%}
.view.active{display:flex}
.brand-mark{color:var(--brand);display:inline-flex}
.brand-mark svg{width:40px;height:40px;display:block}
h1.brand-title{font-size:22px;font-weight:600;margin:16px 0 2px;letter-spacing:.3px}
/* header */
.topbar{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;border-bottom:1px solid var(--border);background:var(--bg)}
.topbar .title{font-size:16px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:0;background:transparent;color:var(--fg-2);font-size:14px;padding:8px 10px;border-radius:10px;cursor:pointer}
.iconbtn:active{background:var(--bg-2)}
/* pair */
#pair-view{align-items:center;justify-content:center;padding:32px 24px;text-align:center}
.pair-card{width:100%;max-width:360px;background:var(--bg-1);border:1px solid var(--border);border-radius:24px;padding:28px 24px}
.pair-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:44px;font-weight:700;letter-spacing:8px;color:var(--brand);margin:18px 0 8px}
.pair-hint{color:var(--fg-2);font-size:13px;line-height:20px}
.spinner{width:22px;height:22px;border:3px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;margin:18px auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff;width:100%}
.btn:active{opacity:.85}
.btn.ghost{background:var(--bg-2);color:var(--fg)}
.btn.danger{background:transparent;border:1px solid var(--err);color:var(--err)}
.btn:disabled{opacity:.5;cursor:default}
/* main */
#main-view .body{flex:1;overflow-y:auto;padding:14px 16px 20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--border);background:var(--bg-1);color:var(--fg-2);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.section-label{font-size:12px;font-weight:600;color:var(--fg-2);text-transform:uppercase;letter-spacing:.5px;margin:8px 2px}
.session{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;background:var(--bg);cursor:pointer}
.session:active{background:var(--bg-1)}
.session .meta{flex:1;min-width:0}
.session .name{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session .time{font-size:12px;color:var(--fg-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.idle{background:var(--bg-2)}
.empty{color:var(--fg-2);text-align:center;padding:32px 12px;font-size:14px}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:56px;height:56px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:28px;font-weight:400;box-shadow:0 6px 18px rgba(77,107,254,.35);cursor:pointer}
/* chat */
#chat-view .body{flex:1;overflow-y:auto;padding:14px 14px 20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;display:flex;flex-direction:column}
.msg .bubble{padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.user .bubble{background:var(--bubble-user);color:var(--bubble-user-fg);border-bottom-right-radius:6px}
.msg.assistant{align-self:flex-start;align-items:flex-start}
.msg.assistant .bubble{background:var(--bg-1);color:var(--fg);border:1px solid var(--border);border-bottom-left-radius:6px}
.msg .time{font-size:11px;color:var(--fg-2);margin-top:4px}
.composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);border-top:1px solid var(--border);background:var(--bg)}
.composer textarea{flex:1;resize:none;border:1px solid var(--border);background:var(--bg-1);color:var(--fg);border-radius:14px;padding:11px 14px;font-size:15px;font-family:inherit;line-height:1.4;max-height:120px;outline:none}
.composer textarea:focus{border-color:var(--brand)}
.composer .send{border:0;background:var(--brand);color:#fff;border-radius:14px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer}
.composer .send:disabled{opacity:.45}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:rgba(20,21,25,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.toast.show{opacity:1}
</style>
</head>
<body>

<section id="pair-view" class="view">
  <span class="brand-mark">
    <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#4D6BFE"/><path d="M32 12 L36 28 L52 32 L36 36 L32 52 L28 36 L12 32 L28 28 Z" fill="#fff"/></svg>
  </span>
  <h1 class="brand-title">dsh 掌上助手</h1>
  <p style="color:var(--fg-2);margin:4px 0 24px;font-size:14px">在手机上使用你的 dsh</p>
  <div class="pair-card" id="pair-card">
    <div id="pair-idle">
      <p class="pair-hint">首次使用需要先配对这台设备。点「开始配对」，随后在桌面浏览器打开 <b>/m/admin</b> 批准。</p>
      <div style="margin-top:18px"><button class="btn" id="pair-start">开始配对</button></div>
    </div>
    <div id="pair-waiting" style="display:none">
      <p class="pair-hint">在桌面打开 <b>/m/admin</b>，确认看到相同 6 位码后点「批准」。</p>
      <div class="pair-code" id="pair-code">------</div>
      <div class="spinner"></div>
      <p class="pair-hint" id="pair-status">等待桌面批准…</p>
      <div style="margin-top:16px"><button class="btn ghost" id="pair-cancel">取消</button></div>
    </div>
  </div>
</section>

<section id="main-view" class="view">
  <div class="topbar">
    <span class="brand-mark" style="width:26px;height:26px"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#4D6BFE"/><path d="M32 12 L36 28 L52 32 L36 36 L32 52 L28 36 L12 32 L28 28 Z" fill="#fff"/></svg></span>
    <div class="title">dsh</div>
    <button class="iconbtn" id="unpair" title="退出配对">退出</button>
  </div>
  <div class="body">
    <div class="chips" id="ws-chips"></div>
    <div class="section-label">会话</div>
    <div id="sessions"></div>
  </div>
  <button class="fab" id="new-session" title="新会话">+</button>
</section>

<section id="chat-view" class="view">
  <div class="topbar">
    <button class="iconbtn" id="chat-back">‹ 返回</button>
    <div class="title" id="chat-title">会话</div>
  </div>
  <div class="body" id="messages"></div>
  <div class="composer">
    <textarea id="composer" rows="1" placeholder="发消息…"></textarea>
    <button class="send" id="send">发送</button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
var $ = function(id){ return document.getElementById(id) }
var currentSession = null
var pollTimer = null

function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('show')
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show') }, 2200)
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }) }
function fmtTime(ms){ if(!ms) return ''; var d=new Date(ms); var now=new Date(); var same=new Date(); same.setHours(0,0,0,0);
  if(d>=same) return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
  return d.toLocaleDateString([], {month:'numeric',day:'numeric'})+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
}

function api(path, opts){
  opts = opts || {}
  var init = { method: opts.method || 'GET', headers: {} }
  if(opts.body !== undefined){ init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body) }
  return fetch(path, init).then(function(r){
    return r.json().then(function(j){ return { status:r.status, body:j } }, function(){ return { status:r.status, body:{} } })
  })
}

function show(id){
  var views = document.querySelectorAll('.view')
  for(var i=0;i<views.length;i++) views[i].classList.remove('active')
  $(id).classList.add('active')
}

/* ── pairing ── */
function startPair(){
  api('/m/api/pair/request', { method:'POST' }).then(function(res){
    if(!res.body.ok){ toast('配对请求失败'); return }
    $('pair-idle').style.display = 'none'
    $('pair-waiting').style.display = 'block'
    $('pair-code').textContent = res.body.code
    pollPair(res.body.requestId)
  })
}
function pollPair(requestId){
  api('/m/api/pair/status?requestId=' + encodeURIComponent(requestId)).then(function(res){
    var b = res.body
    if(b && b.status === 'approved'){ location.reload() }
    else if(b && b.status === 'expired'){ $('pair-status').textContent = '已过期，请重新开始'; $('pair-cancel').textContent = '重试' }
    else { setTimeout(function(){ pollPair(requestId) }, 2000) }
  }).catch(function(){ setTimeout(function(){ pollPair(requestId) }, 3000) })
}

/* ── main ── */
function loadWorkspaces(){
  api('/m/api/workspaces').then(function(res){
    var items = (res.body && res.body.items) || []
    var box = $('ws-chips')
    box.innerHTML = '<button class="chip active" data-ws="all">全部</button>' +
      items.map(function(w){ return '<button class="chip" data-ws="'+esc(w.id)+'">'+esc(w.title)+'</button>' }).join('')
    var chips = box.querySelectorAll('.chip')
    for(var i=0;i<chips.length;i++){
      chips[i].addEventListener('click', function(){
        for(var j=0;j<chips.length;j++) chips[j].classList.remove('active')
        this.classList.add('active')
        loadSessions(this.getAttribute('data-ws'))
      })
    }
    loadSessions('all')
  })
}
function loadSessions(workspaceId){
  api('/m/api/sessions?workspaceId=' + encodeURIComponent(workspaceId || 'all')).then(function(res){
    var items = (res.body && res.body.items) || []
    var box = $('sessions')
    if(!items.length){ box.innerHTML = '<div class="empty">还没有会话，点右下角 + 新建一个</div>'; return }
    box.innerHTML = items.map(function(s){
      return '<div class="session" data-id="'+esc(s.sessionId)+'">' +
        '<span class="dot '+(s.running ? '' : 'idle')+'"></span>' +
        '<div class="meta"><div class="name">'+esc(s.title)+'</div><div class="time">'+fmtTime(s.updatedAt)+(s.blank ? ' · 空会话' : '')+'</div></div>' +
        '</div>'
    }).join('')
    var rows = box.querySelectorAll('.session')
    for(var i=0;i<rows.length;i++){
      rows[i].addEventListener('click', function(){ openSession(this.getAttribute('data-id')) })
    }
  })
}
function openSession(sessionId){
  currentSession = sessionId
  var items = document.querySelectorAll('#sessions .session')
  for(var i=0;i<items.length;i++){
    var name = items[i].querySelector('.name')
    if(items[i].getAttribute('data-id') === sessionId) $('chat-title').textContent = name ? name.textContent : '会话'
  }
  show('chat-view')
  loadMessages(true)
  if(pollTimer) clearInterval(pollTimer)
  pollTimer = setInterval(function(){ loadMessages(false) }, 2500)
}
function newSession(){
  api('/m/api/session/create', { method:'POST', body:{} }).then(function(res){
    if(res.body && res.body.sessionId){ openSession(res.body.sessionId) }
    else toast('创建会话失败')
  })
}
function loadMessages(scroll){
  if(!currentSession) return
  api('/m/api/session?sessionId=' + encodeURIComponent(currentSession) + '&maxMessages=60').then(function(res){
    var msgs = (res.body && res.body.messages) || []
    var box = $('messages')
    var atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120
    box.innerHTML = msgs.map(function(m){
      var cls = m.role === 'user' ? 'user' : 'assistant'
      return '<div class="msg '+cls+'"><div class="bubble">'+esc(m.text)+'</div><div class="time">'+fmtTime(m.time)+'</div></div>'
    }).join('')
    if(scroll || atBottom) box.scrollTop = box.scrollHeight
  })
}
function send(){
  var ta = $('composer')
  var text = ta.value.trim()
  if(!text || !currentSession) return
  $('send').disabled = true
  api('/m/api/session/prompt', { method:'POST', body:{ sessionId: currentSession, text: text } }).then(function(res){
    $('send').disabled = false
    if(res.body && res.body.ok){ ta.value=''; ta.style.height='auto'; loadMessages(true) }
    else toast('发送失败：' + (res.body && res.body.error || '未知'))
  })
}

/* ── bindings ── */
$('pair-start').addEventListener('click', startPair)
$('pair-cancel').addEventListener('click', function(){ location.reload() })
$('unpair').addEventListener('click', function(){
  if(confirm('退出配对后需重新配对。确定？')){ document.cookie = 'dsh_mobile=; Path=/m; Max-Age=0; SameSite=Lax'; location.reload() }
})
$('new-session').addEventListener('click', newSession)
$('chat-back').addEventListener('click', function(){ show('main-view'); loadSessions('all') })
$('send').addEventListener('click', send)
$('composer').addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send() } })
$('composer').addEventListener('input', function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,120)+'px' })

/* ── boot ── */
api('/m/api/me').then(function(res){
  if(res.status === 200 && res.body && res.body.paired){ show('main-view'); loadWorkspaces() }
  else { show('pair-view') }
}).catch(function(){ show('pair-view') })
</script>
</body>
</html>
